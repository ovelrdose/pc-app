# СГЕНЕРИРОВАНО scripts/generate_rules.py из knowledge/tables/. НЕ ПРАВИТЬ РУКАМИ:
# правьте справочник и запустите генератор заново.
- code: GEN-FF-ATX-CASE
  name: Плата ATX должна поддерживаться корпусом
  kind: compat
  group: gen_form_factor
  priority: 900
  cf: 1.0
  origin: generated
  source: tables/form_factors.yaml#motherboard.ATX
  when:
    expr: build.motherboard.form_factor == 'ATX' and not contains(build.case.form_factors, 'ATX')
  then:
  - action: reject
    message: Корпус не рассчитан на плату ATX
  explain: Плата ATX (305×244 мм) крепится только в корпус с соответствующими стойками.
