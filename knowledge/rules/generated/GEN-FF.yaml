- code: GEN-FF-MICRO-ATX-COMPACT
  name: 'Компактная сборка: плата Micro-ATX'
  kind: score
  group: gen_form_factor
  priority: 300
  cf: 0.8
  origin: generated
  source: tables/form_factors.yaml#motherboard.Micro-ATX
  when:
    all:
    - fact: profile.compact
      op: eq
      value: true
    - fact: build.motherboard.form_factor
      op: eq
      value: Micro-ATX
  then:
  - action: prefer
    weight: 2.0
    message: Плата Micro-ATX подходит для компактной сборки
  explain: Плата Micro-ATX позволяет собрать компактный компьютер.
