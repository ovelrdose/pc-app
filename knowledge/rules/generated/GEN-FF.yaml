  when:
    all:
    - fact: build.psu.form_factor
      op: eq
      value: SFX
    - fact: build.case.psu_ff
      op: not_in
      value:
      - SFX
      - ATX
  then:
  - action: reject
    message: Блок питания SFX не встанет в отсек {build.case.psu_ff}
  explain: 'Блок питания SFX ставится в отсеки: SFX, ATX.'
- code: GEN-FF-SIZE-MINI
  name: 'Корпус «mini»: только платы до нужного размера'
  kind: filter
  group: gen_form_factor
  priority: 800
  cf: 1.0
  origin: generated
  source: tables/form_factors.yaml#case_sizes.mini
  when:
    all:
    - fact: req.case_size
      op: eq
      value: mini
    - fact: cand.category
      op: eq
      value: motherboard
    - fact: cand.form_factor
      op: in
      value:
      - ATX
      - E-ATX
  then:
  - action: reject
    message: Плата {cand.form_factor} крупнее выбранного размера корпуса
  explain: В корпус размера «mini» не поместятся платы ATX, E-ATX.
