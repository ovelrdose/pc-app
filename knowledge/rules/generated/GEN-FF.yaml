- code: GEN-FF-PSU-ATX
  name: Блок питания ATX должен встать в отсек корпуса
  kind: compat
  group: gen_form_factor
  priority: 900
  cf: 1.0
  origin: generated
  source: tables/form_factors.yaml#psu.ATX
  when:
    all:
    - fact: build.psu.form_factor
      op: eq
      value: ATX
    - fact: build.case.psu_ff
      op: not_in
      value:
      - ATX
  then:
  - action: reject
    message: Блок питания ATX не встанет в отсек {build.case.psu_ff}
  explain: 'Блок питания ATX ставится в отсеки: ATX.'
- code: GEN-FF-PSU-SFX
