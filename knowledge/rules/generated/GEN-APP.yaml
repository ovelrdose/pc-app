- code: GEN-APP-AFTER-EFFECTS-BASIC
  name: 'Adobe After Effects: базовый уровень'
  kind: goal
  group: gen_app
  priority: 100
  cf: 1.0
  origin: generated
  source: tables/applications.yaml#after_effects
  goal:
    predicate: runs_app
    args:
      app: after_effects
      level: basic
  when:
    all:
    - goal:
        predicate: bench_at_least
        args:
          app: after_effects
          level: basic
    - fact: build.ram.capacity_gb
      op: ge
      value: 16
    - fact: build.cpu.cores
      op: ge
      value: 6
    - fact: build.gpu.vram_gb
      op: ge
      value: 4
  explain: Для базовой работы в Adobe After Effects нужно ОЗУ от 16 ГБ, процессор от 6 ядер, видеопамять
    от 4 ГБ.
