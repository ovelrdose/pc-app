# СГЕНЕРИРОВАНО scripts/generate_rules.py из knowledge/tables/. НЕ ПРАВИТЬ РУКАМИ:
# правьте справочник и запустите генератор заново.
- code: GEN-CHP-A320-OC
  name: Чипсет A320 не поддерживает разгон процессора
  kind: validate
  group: gen_chipset
  priority: 400
  cf: 1.0
  origin: generated
  source: tables/chipsets.yaml#A320
  when:
    all:
    - fact: build.motherboard.chipset
      op: eq
      value: A320
    - fact: build.cpu.unlocked
      op: eq
      value: true
  then:
  - action: warn
    message: 'На чипсете A320 разгон процессора недоступен: переплата за разблокированный множитель не
      окупится'
  explain: На A320 разблокированный множитель процессора не пригодится.
- code: GEN-CHP-A320-TDP
  name: Платы на A320 рассчитаны на CPU до 95 Вт
  kind: compat
  group: gen_chipset
  priority: 900
  cf: 1.0
  origin: generated
  source: tables/chipsets.yaml#A320
  when:
    all:
    - fact: build.motherboard.chipset
      op: eq
      value: A320
    - fact: build.cpu.tdp_w
      op: gt
      value: 95
  then:
  - action: reject
    message: Платы на A320 рассчитаны на процессоры до 95 Вт, а у этого {build.cpu.tdp_w} Вт
  explain: 'Подсистема питания типичных плат на A320 рассчитана на процессоры с TDP до 95 Вт: мощнее —
    перегрев и сброс частот.'
