# СГЕНЕРИРОВАНО scripts/generate_rules.py из knowledge/tables/. НЕ ПРАВИТЬ РУКАМИ:
# правьте справочник и запустите генератор заново.
- code: GEN-SKT-AM4-CHIPSET
  name: Процессор AM4 — только на платах с чипсетами своей платформы
  kind: compat
  group: gen_socket
  priority: 900
  cf: 1.0
  origin: generated
  source: tables/sockets.yaml#AM4
  when:
    all:
    - fact: build.cpu.socket
      op: eq
      value: AM4
    - fact: build.motherboard.chipset
      op: not_in
      value:
      - A320
      - A520
      - B350
      - B450
      - B550
      - X370
      - X470
      - X570
  then:
  - action: reject
    message: Плата на чипсете {build.motherboard.chipset} не поддерживает процессоры AM4
  explain: Процессоры AM4 работают только с чипсетами A320, A520, B350, B450, B550, X370, X470, X570.
- code: GEN-SKT-AM4-FUTURE
  name: 'Задел на будущее: платформа AM4'
  kind: score
  group: gen_socket
  priority: 300
  cf: 0.8
  origin: generated
  source: tables/sockets.yaml#AM4
  when:
    all:
    - fact: user.future_proof
      op: eq
      value: true
    - fact: build.cpu.socket
      op: eq
      value: AM4
  then:
  - action: prefer
    weight: -3.0
    message: Платформа AM4 больше не получит новых процессоров — апгрейд потребует замены платы
  explain: Платформа AM4 больше не получит новых процессоров — апгрейд потребует замены платы.
- code: GEN-SKT-AM4-MEM
  name: Платформа AM4 работает только с памятью DDR4
  kind: compat
  group: gen_socket
  priority: 900
  cf: 1.0
  origin: generated
  source: tables/sockets.yaml#AM4
  when:
    all:
    - fact: build.cpu.socket
      op: eq
      value: AM4
    - fact: build.ram.mem_type
      op: not_in
      value:
      - DDR4
  then:
  - action: reject
    message: Память {build.ram.mem_type} не подходит к платформе AM4
  explain: Контроллер памяти процессоров AM4 поддерживает только DDR4.
