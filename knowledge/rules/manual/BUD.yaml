    - fact: profile.budget_class
      op: eq
      value: premium
    - fact: profile.gaming
      op: ge
      value: 0.5
  then:
  - action: assert
    fact: budget.share.gpu
    value: 0.45
  explain: При большом бюджете в играх выгоднее всего вложиться в видеокарту.
