- code: BUD-009
  name: '4K: больше на видеокарту'
  kind: inference
  group: budget
  priority: 500
  cf: 0.9
  when:
    all:
    - fact: profile.gaming
      op: ge
      value: 0.5
    - fact: user.resolution
      op: eq
      value: 2160p
  then:
  - action: assert
    fact: budget.share.gpu
    value: 0.48
  explain: В 4K всё решает видеокарта — ей отдаётся почти половина бюджета.
- code: BUD-010
  name: '2K и современные игры: больше на видеокарту'
  kind: inference
  group: budget
  priority: 500
  cf: 0.85
  when:
    all:
    - fact: user.weight.aaa_gaming
      op: ge
      value: 0.5
    - fact: user.resolution
      op: eq
      value: 1440p
  then:
  - action: assert
    fact: budget.share.gpu
    value: 0.44
  explain: В 2K видеокарта нагружена сильнее, её доля растёт до 44%.
- code: BUD-011
  name: 'Киберспорт на высокой частоте: больше на процессор'
  kind: inference
  group: budget
  priority: 500
  cf: 0.85
  when:
    all:
    - fact: profile.main
      op: eq
      value: esports
    - fact: profile.high_refresh
      op: eq
      value: true
  then:
  - action: assert
    fact: budget.share.cpu
    value: 0.24
  explain: Сотни кадров в секунду в киберспорте упираются в процессор.
- code: BUD-012
  name: 'Маленький бюджет: обязательные траты'
  kind: inference
  group: budget
  priority: 500
  cf: 0.85
  when:
    fact: profile.budget_class
    op: eq
    value: entry
  then:
  - action: assert
    fact: budget.share.psu
    value: 0.09
  - action: assert
    fact: budget.share.case
    value: 0.07
  explain: При небольшом бюджете даже самые простые БП и корпус занимают заметную долю.
- code: BUD-013
  name: 'Премиальный бюджет: видеокарта'
  kind: inference
