# BUD — распределение бюджета по категориям (budget.share.*). Доли нормируются к 1
# конфигуратором по тем категориям, которые реально подбираются.
- code: BUD-001
  name: Бюджет для современных игр
  kind: inference
  group: budget
  priority: 500
  cf: 0.8
  when:
    fact: profile.main
    op: eq
    value: aaa_gaming
  then:
  - action: assert
    fact: budget.share.gpu
    value: 0.42
  - action: assert
    fact: budget.share.cpu
    value: 0.17
  - action: assert
    fact: budget.share.motherboard
    value: 0.1
  - action: assert
    fact: budget.share.ram
    value: 0.08
  - action: assert
    fact: budget.share.ssd
    value: 0.07
  - action: assert
    fact: budget.share.psu
    value: 0.07
  - action: assert
    fact: budget.share.case
    value: 0.05
  - action: assert
    fact: budget.share.cpu_cooler
    value: 0.03
  explain: 'Для современных игр бюджет делится так: видеокарта 42%, процессор 17%, плата 10%, память 8%,
    SSD 7%, блок питания 7%, корпус 5%, кулер 3%.'
