    value: 0.09
  - action: assert
    fact: budget.share.ssd
    value: 0.07
  - action: assert
    fact: budget.share.psu
    value: 0.07
  - action: assert
    fact: budget.share.case
    value: 0.05
  - action: assert
    fact: budget.share.cpu_cooler
    value: 0.03
  explain: 'Для киберспорта бюджет делится так: видеокарта 36%, процессор 22%, плата 10%, память 9%, SSD
    7%, блок питания 7%, корпус 5%, кулер 3%.'
