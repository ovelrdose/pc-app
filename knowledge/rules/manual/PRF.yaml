- code: PRF-025
  name: Игровой вес
  kind: inference
  group: profile
  priority: 720
  cf: 1.0
  when:
    expr: max(user.weight.esports, user.weight.aaa_gaming) > 0
  then:
  - action: assert
    fact: profile.gaming
    expr: max(user.weight.esports, user.weight.aaa_gaming)
  explain: 'Игровая нагрузка определяется самым важным из игровых сценариев: {round(profile.gaming * 100)}%.'
- code: PRF-026
  name: Вес творческих задач
  kind: inference
  group: profile
  priority: 720
  cf: 1.0
  when:
    expr: max(user.weight.video_editing, user.weight.render_3d, user.weight.photo_cad) > 0
  then:
  - action: assert
    fact: profile.creator
    expr: max(user.weight.video_editing, user.weight.render_3d, user.weight.photo_cad)
  explain: Творческие задачи (монтаж, 3D, фото) весят {round(profile.creator * 100)}%.
- code: PRF-027
