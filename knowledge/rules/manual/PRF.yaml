# PRF — профилирование клиента: из ответов (user.*) выводится профиль (profile.*).
# Выведенные из базы правила (коды не переиспользуются) — в rules/retired.yaml.
- code: PRF-001
  name: Сценарий «офис» заявлен клиентом
  kind: inference
  group: profile
  priority: 700
  cf: 1.0
  when:
    fact: user.weight.office
    op: ge
    value: 0.1
  then:
  - action: assert
    fact: profile.weight.office
    expr: user.weight.office
  explain: Вы отметили задачу «офис» с важностью {round(user.weight.office * 100)}%, она учитывается при
    подборе.
