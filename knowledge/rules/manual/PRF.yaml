    value: true
  explain: Монтаж, 3D и тяжёлая разработка держат в памяти большие проекты.
- code: PRF-048
  name: Вычисления на видеокарте
  kind: inference
  group: profile
  priority: 700
  cf: 0.85
  when:
    fact: user.weight.render_3d
    op: ge
    value: 0.4
  then:
  - action: assert
    fact: profile.gpu_compute
    value: true
  explain: Современный 3D-рендер (Cycles, Redshift) считается на видеокарте.
- code: PRF-049
  name: 'Дискретная видеокарта не нужна: офисные задачи'
  kind: inference
  group: profile
  priority: 690
  cf: 0.8
  when:
    all:
    - fact: profile.main
      op: in
      value:
      - office
      - programming
      - photo_cad
    - any:
      - not:
          fact: profile.gaming
          op: exists
      - fact: profile.gaming
        op: lt
        value: 0.2
    - not:
        fact: profile.gpu_compute
        op: eq
        value: true
    - not:
        fact: profile.creator
        op: ge
        value: 0.4
  then:
  - action: assert
    fact: profile.no_dgpu
    value: true
  explain: Для офиса и разработки хватает встроенной графики процессора — это экономит бюджет.
- code: PRF-050
  name: 'Дискретная видеокарта не нужна: маленький бюджет без игр'
  kind: inference
  group: profile
  priority: 690
  cf: 0.9
  when:
    all:
    - fact: profile.budget_class
      op: eq
      value: entry
    - any:
