  kind: inference
  group: profile
  priority: 700
  cf: 0.9
  when:
    expr: max(user.weight.render_3d, user.weight.video_editing) >= 0.6
  then:
  - action: assert
    fact: profile.workstation
    value: true
  explain: 'Рендер или монтаж — основная работа: нужна рабочая станция с упором на процессор и память.'
- code: PRF-028
  name: Игры и стриминг одновременно
  kind: inference
  group: profile
  priority: 700
  cf: 0.9
  when:
    all:
    - fact: user.weight.streaming
      op: ge
      value: 0.3
    - expr: max(user.weight.esports, user.weight.aaa_gaming) >= 0.5
  then:
  - action: assert
    fact: profile.multitask
    value: true
  explain: Стрим во время игры нагружает процессор и видеокарту одновременно.
- code: PRF-029
  name: Игры и творческие задачи одновременно
  kind: inference
  group: profile
  priority: 700
  cf: 0.8
  when:
    expr: max(user.weight.esports, user.weight.aaa_gaming) >= 0.3 and max(user.weight.video_editing, user.weight.render_3d,
      user.weight.photo_cad) >= 0.5
  then:
  - action: assert
    fact: profile.multitask
    value: true
  explain: Основная задача — творческая работа, но компьютер нужен и для игр — нужен запас по памяти и ядрам.
- code: PRF-030
