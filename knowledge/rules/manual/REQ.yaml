    value: 8
  explain: Для высокой игровой нагрузки нужно от 8 ГБ видеопамяти; больше — с запасом (см. советы).
- code: REQ-009
  name: Видеокарта топ-класса
  kind: inference
  group: requirements
  priority: 600
