# REQ — требования к деталям (req.*), выведенные из профиля и ответов.
# Выведенные из базы правила (коды не переиспользуются) — в rules/retired.yaml.
# CF ≥ 0.5 — обязательное требование (фильтр), меньше — желательное (баллы).
- code: REQ-001
  name: Без дискретной видеокарты
  kind: inference
  group: requirements
  priority: 600
  cf: 0.9
  when:
    fact: profile.no_dgpu
    op: eq
    value: true
  then:
  - action: assert
    fact: req.need.gpu
    value: false
  - action: assert
    fact: req.cpu_igpu
    value: true
  explain: 'Дискретная видеокарта не нужна: изображение выводит встроенная графика процессора.'
- code: REQ-002
  name: Архив на HDD
  kind: inference
  group: requirements
  priority: 600
  cf: 1.0
  when:
    fact: user.archive
    op: eq
    value: true
  then:
  - action: assert
    fact: req.need.hdd
    value: true
  - action: assert
    fact: req.hdd_min_gb
    value: 2000
  explain: Для архива фото и видео добавляется жёсткий диск от 2 ТБ — это дешевле, чем SSD того же объёма.
- code: REQ-003
  name: 'Подсветка: докупить RGB-вентиляторы'
  kind: inference
  group: requirements
  priority: 600
  cf: 0.8
  when:
    fact: user.rgb
    op: eq
    value: true
  then:
  - action: assert
    fact: req.need.case_fan
    value: true
  - action: assert
    fact: req.rgb
    value: true
  explain: Вы хотите подсветку — в сборку добавляются вентиляторы с RGB.
- code: REQ-004
  name: 'Рабочая станция: дополнительный обдув'
  kind: inference
  group: requirements
  priority: 600
  cf: 0.7
  when:
    fact: profile.workstation
    op: eq
    value: true
  then:
  - action: assert
    fact: req.need.case_fan
    value: true
  - action: assert
    fact: req.extra_fans
    value: 2
  explain: Долгий рендер нагревает корпус — нужны дополнительные вентиляторы.
- code: REQ-005
  name: 'Мощная видеокарта: дополнительный обдув'
  kind: inference
  group: requirements
  priority: 600
  cf: 0.6
  when:
    fact: profile.gaming_tier
    op: eq
    value: extreme
  then:
  - action: assert
    fact: req.need.case_fan
    value: true
  explain: Топовая видеокарта выделяет много тепла — корпусу нужен хороший обдув.
- code: REQ-006
  name: Видеокарта для лёгких игр
  kind: inference
  group: requirements
  priority: 600
  cf: 0.8
  when:
    all:
    - fact: profile.gaming_tier
      op: eq
      value: light
    - &id001
      fact: user.weight.aaa_gaming
      op: ge
      value: 0.5
  then:
  - action: assert
    fact: req.gpu_vram_min_gb
    value: 8
  explain: При лёгкой игровой нагрузке хватит 8 ГБ видеопамяти.
- code: REQ-007
  name: Видеокарта среднего класса
  kind: inference
  group: requirements
  priority: 600
