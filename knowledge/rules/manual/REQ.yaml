    all:
    - fact: profile.gaming
      op: ge
      value: 0.5
    - fact: need.gpu_rt
      op: gt
      value: 0
  then:
  - action: assert
    fact: req.gpu_rt_min
    expr: need.gpu_rt
  explain: '{need.rt_game} работает только с трассировкой лучей — нужна видеокарта с индексом трассировки
    от {need.gpu_rt}.'
- code: REQ-055
  name: Процессор под игры клиента
  kind: inference
  group: requirements
  priority: 600
  cf: 0.9
  when:
    all:
    - fact: profile.gaming
      op: ge
      value: 0.5
    - fact: need.cpu_single
      op: ge
      value: 85
  then:
  - action: assert
    fact: req.cpu_single_min
    expr: need.cpu_single
  explain: Чтобы {need.cpu_game} выдавала {need.cpu_fps} кадров/с, нужен процессор с одноядерным индексом от
    {need.cpu_single}.
- code: REQ-056
  name: 'Игры — дополнительная задача: видеокарта желательна'
  kind: inference
  group: requirements
  priority: 600
  cf: 0.4
  when:
    all:
    - fact: profile.gaming
      op: ge
      value: 0.3
    - fact: profile.gaming
