    - fact: profile.gaming_tier
      op: eq
      value: mid
    - *id001
  then:
  - action: assert
    fact: req.gpu_vram_min_gb
    value: 8
  explain: Для современных игр на средней нагрузке нужно от 8 ГБ видеопамяти.
- code: REQ-008
  name: Видеокарта высокого класса
  kind: inference
