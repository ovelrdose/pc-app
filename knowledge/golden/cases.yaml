- id: G-016
  title: Сквозной пример вики (страница 8) — в основном игры, иногда монтаж, 2K/144–180 Гц, белый корпус, 170 000 ₽
  answers: { tasks: { main: aaa_gaming, extra: [video_editing] }, budget: 170000, monitor: qhd_144, games: [cyberpunk_2077, baldurs_gate_3], color: white, storage_gb: 1000, archive: "no", future_proof: "yes" }
  expect:
    facts: { profile.main: aaa_gaming, profile.secondary: video_editing, profile.gaming_tier: high, need.gpu_game: Cyberpunk 2077, req.gpu_raster_min: 122, req.ram_min_gb: 16, req.color: white, req.cpu_single_min: 85 }
    fired: [PRF-011, PRF-021, PRF-054, REQ-008, REQ-018, REQ-024, REQ-030, REQ-053, BUD-010, BUD-023]
    rejected: { CASE-ZALMAN-S2: FLT-016, GPU-PALIT-RTX5060-DUAL: FLT-003 }
    all_tiers:
      max_total_rub: 170000
      build: { build.case.color: white, build.gpu.vram_gb: { ge: 8 }, build.gpu.perf_raster: { ge: 122 }, build.cpu.perf_single: { ge: 85 }, build.ssd.capacity_gb: { ge: 1000 } }
      issues: [VAL-013]
      preferences: [BAL-017]
      perf: { fps.cyberpunk_2077.1440p.high: { ge: 60 }, fps.baldurs_gate_3.1440p.high: { ge: 60 } }
    economy:
      build: { build.gpu.vram_gb: 8, build.ram.capacity_gb: 16 }
      issues: [VAL-022, VAL-023]
    maximum:
      build: { build.gpu.vram_gb: { ge: 12 }, build.ram.capacity_gb: 32 }
      preferences: [SCR-026]
      perf: { fps.cyberpunk_2077.1440p.high: { ge: 90 }, fps.baldurs_gate_3.1440p.ultra: { ge: 60 }, perf.bottleneck_ratio: { between: [0.85, 1.5] } }
      hypotheses:
        - { predicate: runs_game, args: { game: cyberpunk_2077, preset: ultra }, status: unknown, asks: [target_fps] }
        - { predicate: runs_game, args: { game: cyberpunk_2077, preset: ultra }, bindings: { target_fps: 60 }, status: proved }
        - { predicate: runs_game, args: { game: alan_wake_2, preset: ultra }, bindings: { target_fps: 60, resolution: "2160p" }, status: failed }
        - { predicate: runs_app, args: { app: davinci_resolve, level: basic }, status: proved }
    why_not:
      - { sku: GPU-PALIT-RTX5060-DUAL, verdict: filtered, rules: [FLT-003] }
      - { sku: CASE-ZALMAN-S2, verdict: filtered, rules: [FLT-016] }
      - { sku: GPU-MSI-RTX5080-VENTUS-3X, verdict: over_budget }
      - { sku: CPU-AMD-R5-7600, verdict: incompatible, rules: [CMP-001] }
      - { sku: HDD-WD-BLUE-2TB, verdict: not_needed }
      - { sku: GPU-SAPPHIRE-RX9060XT-16G-PULSE, verdict: worse }

