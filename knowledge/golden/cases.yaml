# Golden cases — эталонные консультации (архитектура §6.3). Прогоняются в tests/kb и перед
# публикацией базы знаний. perf — прогноз модели производительности:
#   fps.<игра>.<разрешение>.<пресет>, ratio.<…> (CPU/GPU), app.<программа>.minutes|basic|pro, perf.<факт>.
#
# answers — ответы визарда (knowledge/questionnaire.yaml); owned — артикулы имеющихся деталей.
# expect.facts / build — литерал (равенство) или {ge, le, gt, lt, eq, ne, in, contains}.

- id: G-001
  title: Современные игры 2K/144–180 Гц, 150 000 ₽, RGB и задел на будущее
  answers: { tasks: { main: aaa_gaming }, budget: 150000, monitor: qhd_144, rgb: "yes", future_proof: "yes" }
  expect:
    facts: { profile.main: aaa_gaming, profile.gaming_tier: high, req.gpu_vram_min_gb: 8, req.need.case_fan: true }
    fired: [PRF-003, PRF-011, PRF-054, REQ-003, REQ-008, REQ-053, BUD-001, BUD-010]
    rejected: { GPU-PALIT-RTX5060-DUAL: FLT-003, CPU-AMD-R5-5600G: FLT-001 }
    trace_rules: [CMP-001]
    all_tiers:
      max_total_rub: 150000
      build: { build.gpu.vram_gb: { ge: 8 }, build.gpu.perf_raster: { ge: 135 }, build.ram.modules: 2, build.case_fan.rgb: true }
      issues: [BAL-028, VAL-023]
      preferences: [SCR-004]
      perf: { fps.cyberpunk_2077.1440p.high: { ge: 60 }, perf.gpu_utilization: { ge: 0.85 } }
    economy:
      build: { build.gpu.vram_gb: 8 }
      issues: [VAL-010, VAL-022]
      preferences: [GEN-SKT-LGA1700-FUTURE]
    maximum:
      build: { build.gpu.vram_gb: { ge: 12 }, build.cpu.socket: AM5 }
      preferences: [GEN-SKT-AM5-FUTURE]
      perf: { fps.cyberpunk_2077.1440p.high: { ge: 65 } }

- id: G-002
  title: Офис за 50 000 ₽ — без видеокарты
  answers: { tasks: { main: office }, budget: 50000 }
  expect:
    facts: { profile.main: office, profile.no_dgpu: true, req.need.gpu: false, req.cpu_igpu: true }
    fired: [PRF-049, PRF-050, REQ-001, BUD-003, BUD-020]
    rejected: { CPU-INTEL-I5-12400F: FLT-008 }
    all_tiers:
      max_total_rub: 50000
      absent: [gpu]
      build: { build.cpu.igpu: true, build.ram.capacity_gb: { ge: 8 } }
      issues: [VAL-001]
      preferences: [SCR-025]
      perf: { app.office.basic: true, fps.cs2.1080p.medium: { lt: 60 } }
      hypotheses:
        - { predicate: office_ready, status: proved }
        - { predicate: runs_app, args: { app: office, level: basic }, status: proved }
        - { predicate: runs_game, args: { game: cs2, preset: high }, bindings: { resolution: "1080p", target_fps: 60 }, status: failed }

