# Программы и требования по уровням работы: basic — освоение и небольшие проекты, pro — работа
# профессионально. vram_min_gb = 0 — хватит встроенной графики.
# task / ref_minutes — типовая операция и её время на эталонной системе (Ryzen 5 7600 + RTX 4060);
# min_index — минимальный индекс нагрузки программы (см. workload) для уровня, эталон = 100.
applications:
  - id: blender
    title: "Blender"
    scenario: render_3d
    workload: gpu
    task: "Рендер сцены Classroom (Cycles)"
    ref_minutes: 4.0
    basic: { ram_min_gb: 16, vram_min_gb: 8, cpu_cores_min: 6, min_index: 70 }
    pro: { ram_min_gb: 64, vram_min_gb: 16, cpu_cores_min: 12, min_index: 130 }
  - id: davinci_resolve
    title: "DaVinci Resolve"
    scenario: video_editing
